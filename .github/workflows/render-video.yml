name: Render MADI Video

on:
  workflow_dispatch:
    inputs:
      video_name:
        description: 'Pilih video yang akan dibuat'
        required: true
        type: choice
        options:
          - MadiFinance
          - DieselEngine
        default: MadiFinance

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate American English voice-over
        if: inputs.video_name == 'MadiFinance'
        run: |
          python -m pip install edge-tts
          mkdir -p public/audio
          edge-tts --voice en-US-AndrewNeural --rate=-5% --pitch=+1Hz --text "You work hard. You get paid. So why does it still feel like you are getting nowhere? The problem might not be what you earn." --write-media public/audio/madi-finance-1.mp3
          edge-tts --voice en-US-AndrewNeural --rate=-4% --pitch=+0Hz --text "Your paycheck lands. Rent, bills, food, and small purchases take their share. Before you know it, the money is gone. Then it starts all over again." --write-media public/audio/madi-finance-2.mp3
          edge-tts --voice en-US-AndrewNeural --rate=-5% --pitch=+1Hz --text "The difference is what happens next. Spend every dollar, and nothing grows. Keep a portion, invest carefully, and give it time. That is how progress begins." --write-media public/audio/madi-finance-3.mp3

      - name: Setup Remotion browser
        run: npx remotion browser ensure

      - name: Render selected video
        env:
          VIDEO_NAME: ${{ inputs.video_name }}
        run: |
          mkdir -p output
          npx remotion render src/index.ts "$VIDEO_NAME" "output/$VIDEO_NAME.mp4" --codec=h264 --gl=swangle

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: MADI-${{ inputs.video_name }}
          path: output/${{ inputs.video_name }}.mp4
          if-no-files-found: error
