name: Render MADI Videos

on:
  workflow_dispatch:
    inputs:
      video_name:
        description: 'Pilih video yang akan dibuat'
        required: true
        type: choice
        options:
          - ExcavatorHydraulic
          - MadiFinance
          - DieselEngine
        default: ExcavatorHydraulic

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Generate Full Indonesian Narration
        if: inputs.video_name == 'ExcavatorHydraulic'
        run: |
          python -m pip install edge-tts
          mkdir -p public/audio
          edge-tts --voice id-ID-ArdiNeural --rate=+0% --text "Excavator bisa mengangkat tanah berton-ton. Tapi tahukah kamu, kekuatannya bukan dari otot besi, melainkan dari oli. Mesin diesel memutar pompa hidrolik. Pompa ini mendorong oli bertekanan tinggi lewat selang. Oli itu masuk ke silinder hidrolik. Tekanannya mendorong batang silinder, dan lengan excavator pun bergerak. Setiap tuas yang digerakkan operator membuka katup yang mengatur ke mana oli mengalir: ke boom, arm, atau bucket. Jadi, oli kecil bisa menggerakkan lengan raksasa. Follow Kuli Mesin untuk belajar alat berat lainnya!" --write-media public/audio/hydraulic-full.mp3

      - name: Setup Remotion browser
        run: npx remotion browser ensure

      - name: Render selected video
        env:
          VIDEO_NAME: ${{ inputs.video_name }}
        run: |
          mkdir -p output
          npx remotion render src/index.ts "$VIDEO_NAME" "output/$VIDEO_NAME.mp4" --codec=h264 --gl=swangle

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.video_name }}-video
          path: output/${{ inputs.video_name }}.mp4
          if-no-files-found: error
