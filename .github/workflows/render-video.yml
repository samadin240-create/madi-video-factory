name: Render MADI Video

on:
  workflow_dispatch:
    inputs:
      video_name:
        description: 'Pilih video yang akan dibuat'
        required: true
        type: choice
        options:
          - MadiFinance
          - DieselEngine
        default: MadiFinance

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Remotion browser
        run: npx remotion browser ensure

      - name: Render selected video
        env:
          VIDEO_NAME: ${{ inputs.video_name }}
        run: |
          mkdir -p output
          npx remotion render src/index.ts "$VIDEO_NAME" "output/$VIDEO_NAME.mp4" --codec=h264 --gl=swangle

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: MADI-${{ inputs.video_name }}
          path: output/${{ inputs.video_name }}.mp4
          if-no-files-found: error
