name: Render MADI Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Remotion browser
        run: npx remotion browser ensure

      - name: Render video
        run: npx remotion render src/index.ts DieselEngine output/DieselEngine.mp4 --codec=h264 --gl=swangle

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: MADI-DieselEngine
          path: output/DieselEngine.mp4
          if-no-files-found: error
