name: MADI Microstock Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render Microstock preview
        run: |
          mkdir -p output
          npx remotion render src/index.ts MadiMicrostockGear output/madi-microstock-preview.mp4 --codec=h264 --frames=0-89 --scale=0.25

      - name: Upload preview video
        uses: actions/upload-artifact@v4
        with:
          name: MADI-Microstock-Preview
          path: output/madi-microstock-preview.mp4
          if-no-files-found: error
          retention-days: 7
